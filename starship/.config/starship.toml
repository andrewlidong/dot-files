#:schema https://starship.rs/config-schema.json
# ─────────────────────────────────────────────────────────────
#  Starship — Tokyo Night
#  Only the modules listed in `format` ever render, so this stays quiet
#  by default and lights up when there's something worth saying.
# ─────────────────────────────────────────────────────────────

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$python\
$ruby\
$golang\
$rust\
$bun\
$kubernetes\
$aws\
$cmd_duration\
$jobs\
$line_break\
$character"""

right_format = """$time"""

add_newline = true
command_timeout = 1000

# ─── Prompt character ────────────────────────────────────────
[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol   = "[❯](bold #f7768e)"
vicmd_symbol   = "[❮](bold #e0af68)"

# ─── Directory ───────────────────────────────────────────────
[directory]
style             = "bold #7aa2f7"
format            = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo  = true
truncation_symbol = "…/"
read_only         = " 󰌾"
read_only_style   = "#f7768e"
home_symbol       = "~"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Desktop"   = ""
"Pictures"  = ""
"conductor/repos" = "󰑖"

# ─── Git ─────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bold #bb9af7"
format = "[$symbol$branch]($style)[$remote]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style      = "#e0af68"
format     = "([$all_status$ahead_behind]($style) )"
conflicted = "[󰞇 ${count}](bold #f7768e)"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "[?${count}](#565f89)"
stashed    = "[*${count}](#7dcfff)"
modified   = "[●${count}](#e0af68)"
staged     = "[+${count}](#9ece6a)"
renamed    = "[»${count}](#7dcfff)"
deleted    = "[✘${count}](#f7768e)"

[git_state]
style = "bold #f7768e"
format = "([$state( $progress_current/$progress_total)]($style) )"
rebase = "REBASE"
merge  = "MERGE"
cherry_pick = "CHERRY-PICK"

# ─── Languages (only shown in relevant projects) ─────────────
[nodejs]
symbol = " "
style  = "#9ece6a"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style  = "#e0af68"
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[ruby]
symbol = " "
style  = "#f7768e"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style  = "#7dcfff"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style  = "#ff9e64"
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style  = "#ff9e64"
format = "[$symbol($version )]($style)"

# ─── Infra context ───────────────────────────────────────────
# Off in ordinary directories; appears when a project looks k8s-shaped.
[kubernetes]
disabled       = false
symbol         = "󱃾 "
style          = "#7dcfff"
format         = '[$symbol$context( \($namespace\))]($style) '
detect_files   = ["Chart.yaml", "skaffold.yaml", "kustomization.yaml", "values.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "charts", "helm"]

[aws]
symbol = "󰸏 "
style  = "#ff9e64"
format = '[$symbol($profile )(\($region\) )]($style)'

# ─── Feedback ────────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style    = "italic #565f89"
format   = "[ $duration]($style) "

[jobs]
symbol    = ""
style     = "#bb9af7"
format    = "[$symbol$number]($style) "
threshold = 1

[time]
disabled    = false
style       = "#3b4261"
format      = "[$time]($style)"
time_format = "%H:%M"
