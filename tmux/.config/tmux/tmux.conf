# ─────────────────────────────────────────────────────────────
#  tmux — prefix is C-a  ·  reload with  C-a r
# ─────────────────────────────────────────────────────────────

# ─── Prefix ──────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a sends a literal C-a (start-of-line)

# ─── Terminal / colors ───────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,*:usstyle"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"   # undercurl
set -g  allow-passthrough on                          # image/OSC protocols

# ─── Sane defaults ───────────────────────────────────────────
set -g base-index 1                # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on         # no gaps after closing a window
set -g escape-time 0               # no delay after ESC (vim feels broken otherwise)
set -g repeat-time 600
set -g history-limit 100000
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off       # jump to another session instead of exiting
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S · #W"

# ─── Splits & windows ────────────────────────────────────────
# | and - are visual mnemonics; both open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation — with prefix (repeatable) …
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# … and without prefix, via Option/Alt (needs macos-option-as-alt in Ghostty)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize (hold the prefix and repeat H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Space next-layout
bind    z     resize-pane -Z          # zoom the pane to full window
bind    x     kill-pane
bind    X     kill-window
bind    m     command-prompt -I "#W" "rename-window '%%'"
bind    S     command-prompt -I "#S" "rename-session '%%'"

# Window switching without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n S-Left  previous-window
bind -n S-Right next-window

# Move panes between windows
bind    b break-pane -d                                   # pane → its own window
bind    @ command-prompt -p "join pane from window:" "join-pane -s '%%'"

# ─── Sessions ────────────────────────────────────────────────
# fzf jump to any project. Runs in a popup because fzf needs a real tty
# (run-shell has none, so it would silently do nothing).
bind f   display-popup -E -w 80% -h 75% "~/.local/bin/tmux-sessionizer"
bind C-f display-popup -E -w 80% -h 75% "~/.local/bin/tmux-sessionizer"
bind s choose-tree -Zs                                    # visual session/window picker
bind ( switch-client -p
bind ) switch-client -n
bind L switch-client -l                                   # last session

# ─── Popups (tmux 3.2+) ──────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "$SHELL"
# Single-quoted so tmux leaves $EDITOR alone and the popup's shell expands it.
bind e display-popup -E -w 80% -h 80% '${EDITOR:-vim} ~/.config/tmux/tmux.conf'

# ─── Copy mode (vi) ──────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y     send -X copy-pipe-and-cancel "pbcopy" \; send -X cursor-down
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind P paste-buffer -p

# ─── Reload ──────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message " tmux.conf reloaded"

# ─────────────────────────────────────────────────────────────
#  Tokyo Night status line
# ─────────────────────────────────────────────────────────────
%hidden BG="#1a1b26"
%hidden BG_ALT="#24283b"
%hidden FG="#c0caf5"
%hidden GREY="#565f89"
%hidden BLUE="#7aa2f7"
%hidden PURPLE="#bb9af7"
%hidden CYAN="#7dcfff"
%hidden GREEN="#9ece6a"
%hidden YELLOW="#e0af68"
%hidden RED="#f7768e"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=${BG},fg=${FG}"

# Pane borders — thin and dim until focused.
set -g pane-border-style        "fg=${BG_ALT}"
set -g pane-active-border-style "fg=${BLUE}"
set -g pane-border-lines single
set -g display-panes-colour        "${GREY}"
set -g display-panes-active-colour "${BLUE}"

set -g message-style         "bg=${BG_ALT},fg=${CYAN}"
set -g message-command-style "bg=${BG_ALT},fg=${CYAN}"
set -g mode-style            "bg=${BLUE},fg=${BG},bold"   # copy-mode selection

# Left: session name in a solid block with a powerline cap.
set -g status-left-length 60
set -g status-left "#[bg=${BLUE},fg=${BG},bold]  #S #[bg=${BG},fg=${BLUE},nobold]#[default] "

# Windows: dim when inactive, purple pill when active.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=${GREY}] #I #W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[bg=${BG},fg=${BG_ALT},nobold]#[bg=${BG_ALT},fg=${PURPLE},bold] #I #W#{?window_zoomed_flag, ,} #[bg=${BG},fg=${BG_ALT},nobold]"
setw -g window-status-activity-style "fg=${YELLOW}"
setw -g window-status-bell-style     "fg=${RED},bold"

# Right: a PREFIX badge while the prefix is held, then date + time.
set -g status-right-length 90
set -g status-right "#{?client_prefix,#[bg=${BG}#,fg=${RED}#,nobold]#[bg=${RED}#,fg=${BG}#,bold] PREFIX #[bg=${BG}#,fg=${RED}#,nobold]#[default] ,}#[fg=${BG_ALT}]#[bg=${BG_ALT},fg=${GREY}] %a %b %d #[bg=${BG_ALT},fg=${CYAN}]#[bg=${CYAN},fg=${BG},bold] %H:%M "

# ─────────────────────────────────────────────────────────────
#  Plugins (tpm) — install/update with  C-a I  /  C-a U
# ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # C-a C-s save / C-a C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'    # …and do it automatically

set -g @resurrect-strategy-vim  'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this last.
run '~/.config/tmux/plugins/tpm/tpm'
